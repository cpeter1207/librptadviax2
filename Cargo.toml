[package]
name = "rptadviax2"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "GPL-2.0-only"
description = "Standalone IAX2 protocol and transport adapters for rpt_advanced"
build = "build.rs"

[lib]
crate-type = ["rlib", "cdylib"]

[dependencies]
audio-codec-algorithms = "0.7.0"
rptadv-codec-client = { git = "https://github.com/cpeter1207/rptadv-codec-adapters", rev = "becbff939a0817cc91df6dcb0d40e85e381ec87b" }
rptadv-jitter-client = { git = "https://github.com/cpeter1207/rpt_advanced", rev = "b244eb17cf96ca839c92125f9062f34f03f644bd" }
getrandom = "0.2"
libc = "=0.2.189"
md-5 = "0.10.6"
tokio = { version = "=1.54.1", features = ["net", "rt-multi-thread", "sync", "time", "macros"] }
sha1 = "0.10.6"

[dev-dependencies]
libloading = "0.8"
tokio = { version = "=1.54.1", features = ["test-util"] }
