[package]
name = "rptadviax2"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "GPL-2.0-only"
description = "Standalone IAX2 protocol and transport adapters for rpt_advanced"
build = "build.rs"

[lib]
crate-type = ["rlib", "cdylib"]

[dependencies]
audio-codec-algorithms = "0.7.0"
libloading = "0.8"
getrandom = "0.2"
md-5 = "0.10.6"
tokio = { version = "=1.48.0", features = ["net", "rt-multi-thread", "sync", "time", "macros"] }
sha1 = "0.10.6"

[build-dependencies]
bindgen = "0.72.1"

[dev-dependencies]
tokio = { version = "=1.48.0", features = ["test-util"] }
